name: Ejecutable para Mac

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust para Intel y Apple Silicon
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Compilar
        working-directory: app
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Crear Huesos Studio.app (universal)
        run: |
          APP="Huesos Studio.app"
          mkdir -p "$APP/Contents/MacOS"
          lipo -create \
            app/target/aarch64-apple-darwin/release/huesos-studio \
            app/target/x86_64-apple-darwin/release/huesos-studio \
            -output "$APP/Contents/MacOS/huesos-studio"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Huesos Studio</string>
            <key>CFBundleDisplayName</key><string>Huesos Studio</string>
            <key>CFBundleIdentifier</key><string>es.huesos.studio</string>
            <key>CFBundleVersion</key><string>0.2.0</string>
            <key>CFBundleShortVersionString</key><string>0.2.0</string>
            <key>CFBundleExecutable</key><string>huesos-studio</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" HuesosStudio-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HuesosStudio-mac
          path: HuesosStudio-mac.zip
