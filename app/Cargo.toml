[package]
name = "huesos-studio"
version = "0.2.0"
edition = "2021"
description = "Editor de animación 2D con huesos (estilo Spine) para Windows, Linux y Mac"

[[bin]]
name = "huesos-studio"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
